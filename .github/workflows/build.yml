name: Build macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 添加权限，允许创建 Release
permissions:
  contents: write

jobs:
  build:
    # 使用更明确的运行器，避免队列问题
    runs-on: macos-15

    steps:
    - name: Checkout repository
      # 升级到 v5 以解决 Node.js 20 警告
      uses: actions/checkout@v5

    # 如果你的项目需要特定 Swift 版本，请启用此步骤
    # - name: Setup Swift
    #   uses: swift-actions/setup-swift@v2
    #   with:
    #     swift-version: '5.9'

    - name: Build release executable
      # 明确指定 product 名称，避免歧义
      run: swift build -c release --product ImageCropper

    - name: Create App Bundle
      run: |
        APP_NAME="ImageCropper"
        APP_DIR="$APP_NAME.app"
        mkdir -p "$APP_DIR/Contents/MacOS"
        mkdir -p "$APP_DIR/Contents/Resources"

        # 使用 --show-bin-path 动态获取二进制文件路径，更可靠
        BIN_PATH=$(swift build -c release --product $APP_NAME --show-bin-path)
        cp "$BIN_PATH/$APP_NAME" "$APP_DIR/Contents/MacOS/"

        # 创建 Info.plist (请根据你的项目信息修改)
        cat > "$APP_DIR/Contents/Info.plist" <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>$APP_NAME</string>
            <key>CFBundleIdentifier</key>
            <string>com.whaler2030.$APP_NAME</string>
            <key>CFBundleName</key>
            <string>$APP_NAME</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
        </dict>
        </plist>
        EOF

    - name: Zip the App
      run: zip -r ImageCropper.app.zip ImageCropper.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ImageCropper-macOS
        path: ImageCropper.app.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ImageCropper.app.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
