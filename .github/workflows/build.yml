name: Build macOS App

on:
  push:
    tags:
      - 'v*'          # 推送 v1.0.0 这样的 tag 时触发
  workflow_dispatch:  # 允许在 Actions 页面手动触发

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    # 使用 macOS 15 运行器（ARM64），但我们会交叉编译出通用二进制
    runs-on: macos-15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5   # v5 避免 Node.js 20 弃用警告

    - name: Build universal binary
      run: |
        # 同时为 arm64 和 x86_64 编译，生成通用二进制
        swift build -c release --product ImageCropper \
          --arch arm64 --arch x86_64

    - name: Create App Bundle
      run: |
        APP_NAME="ImageCropper"
        APP_DIR="$APP_NAME.app"
        mkdir -p "$APP_DIR/Contents/MacOS"
        mkdir -p "$APP_DIR/Contents/Resources"

        # 获取二进制文件所在目录（SwiftPM 对多架构构建会放在 .build/apple/Products/Release）
        BIN_PATH=$(swift build -c release --product $APP_NAME --arch arm64 --arch x86_64 --show-bin-path)
        echo "Binary path: $BIN_PATH"
        ls -la "$BIN_PATH"

        # 复制可执行文件
        cp "$BIN_PATH/$APP_NAME" "$APP_DIR/Contents/MacOS/"

        # 验证二进制架构（应显示 x86_64 和 arm64）
        lipo -info "$APP_DIR/Contents/MacOS/$APP_NAME"

        # 创建 Info.plist
        cat > "$APP_DIR/Contents/Info.plist" <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>$APP_NAME</string>
            <key>CFBundleIdentifier</key>
            <string>com.whaler2030.$APP_NAME</string>
            <key>CFBundleName</key>
            <string>$APP_NAME</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
        </dict>
        </plist>
        EOF

    - name: Zip the App
      run: zip -r ImageCropper.app.zip ImageCropper.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ImageCropper-macOS
        path: ImageCropper.app.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: ImageCropper.app.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
